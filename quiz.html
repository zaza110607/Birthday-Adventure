<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Persahabatan 💙</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff4ff, #ffffff, #bde3ff);
            color: #164b6b;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: white;
            border-radius: 28px;
            padding: 30px 22px;
            box-shadow: 0 10px 35px rgba(0, 100, 160, 0.18);
            text-align: center;
        }

        h1 {
            color: #087fbd;
            margin-top: 0;
        }

        .progress {
            color: #60859a;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            color: #164b6b;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer {
            width: 100%;
            padding: 14px;
            border: 2px solid #bde3ff;
            border-radius: 18px;
            background: white;
            color: #165b7d;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer:hover {
            background: #e8f7ff;
        }

        .answer.correct {
            background: #c9f7d5;
            border-color: #48b96b;
            color: #176b30;
        }

        .answer.wrong {
            background: #ffd7d7;
            border-color: #e66a6a;
            color: #9b2525;
        }

        .feedback {
            margin-top: 18px;
            font-weight: bold;
            min-height: 25px;
        }

        .next-question {
            margin-top: 20px;
            border: none;
            background: #168bd0;
            color: white;
            padding: 13px 25px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .next-question.show {
            display: inline-block;
        }

        /* HASIL QUIZ */

        #result {
            display: none;
        }

        .score {
            font-size: 65px;
            font-weight: bold;
            color: #087fbd;
            margin: 20px 0;
        }

        .result-text {
            font-size: 18px;
            line-height: 1.6;
            color: #527d96;
        }

        .next-page {
            margin-top: 25px;
            width: 100%;
            border: none;
            background: #168bd0;
            color: white;
            padding: 15px;
            border-radius: 25px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 120, 190, 0.2);
        }

        .next-page:hover {
            background: #0d72ae;
        }

        .heart {
            position: fixed;
            font-size: 22px;
            opacity: 0.5;
            animation: float 7s linear infinite;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }

            20% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="heart" style="left:10%; animation-delay:0s;">💙</div>
    <div class="heart" style="left:30%; animation-delay:2s;">🤍</div>
    <div class="heart" style="left:55%; animation-delay:4s;">💙</div>
    <div class="heart" style="left:80%; animation-delay:1s;">🤍</div>

    <div class="container">

        <!-- HALAMAN QUIZ -->

        <div class="card" id="quiz">

            <h1>Quiz Persahabatan 💙</h1>

            <div class="progress" id="progress">
                Pertanyaan 1 dari 10
            </div>

            <div class="question" id="question">
                Pertanyaan akan muncul di sini
            </div>

            <div class="answers" id="answers"></div>

            <div class="feedback" id="feedback"></div>

            <button class="next-question" id="nextQuestion">
                Pertanyaan Berikutnya ➜
            </button>

        </div>


        <!-- HALAMAN HASIL -->

        <div class="card" id="result">

            <h1>Quiz Selesai! 🎉</h1>

            <div class="score" id="score">
                0 / 10
            </div>

            <div class="result-text" id="resultText">
                Hebat banget! 🥰💙
            </div>

            <!-- TOMBOL KE HALAMAN KENANGAN -->

            <button class="next-page" onclick="keKenangan()">
                💙 Berikutnya — Foto Kenangan
            </button>

        </div>

    </div>


    <script>

        const questions = [

            {
                question: "Apa yang paling penting dalam persahabatan kita?",
                answers: [
                    "Saling mendukung 💙",
                    "Bertengkar terus",
                    "Tidak peduli",
                    "Saling menjauh"
                ],
                correct: 0
            },

            {
                question: "Kalau kita sedang bersama, biasanya kita...",
                answers: [
                    "Serius terus",
                    "Banyak ketawa 😂",
                    "Tidur sepanjang waktu",
                    "Diam saja"
                ],
                correct: 1
            },

            {
                question: "Apa yang membuat persahabatan kita tetap kuat?",
                answers: [
                    "Kejujuran 🤍",
                    "Rahasia",
                    "Saling menghindar",
                    "Tidak pernah berbicara"
                ],
                correct: 0
            },

            {
                question: "Kalau ada masalah, sebaiknya kita...",
                answers: [
                    "Saling menyalahkan",
                    "Diam saja",
                    "Membicarakannya baik-baik 💙",
                    "Pergi"
                ],
                correct: 2
            },

            {
                question: "Apa yang paling seru dilakukan bersama?",
                answers: [
                    "Membuat kenangan 📸",
                    "Bertengkar",
                    "Saling mengabaikan",
                    "Tidak melakukan apa-apa"
                ],
                correct: 0
            },

            {
                question: "Sahabat yang baik akan selalu...",
                answers: [
                    "Mendukung saat susah dan senang 🤍",
                    "Menghilang",
                    "Mengejek terus",
                    "Tidak peduli"
                ],
                correct: 0
            },

            {
                question: "Kenangan bersama sahabat biasanya...",
                answers: [
                    "Mudah dilupakan",
                    "Tidak berarti",
                    "Selalu punya cerita sendiri 💙",
                    "Tidak penting"
                ],
                correct: 2
            },

            {
                question: "Kalau sahabat sedang sedih, kita sebaiknya...",
                answers: [
                    "Meninggalkannya",
                    "Menghibur dan mendengarkan 🥰",
                    "Menertawakannya",
                    "Tidak peduli"
                ],
                correct: 1
            },

            {
                question: "Apa arti sahabat bagi kita?",
                answers: [
                    "Orang yang selalu ada 🤍",
                    "Orang asing",
                    "Teman sementara",
                    "Tidak ada arti"
                ],
                correct: 0
            },

            {
                question: "Apa yang ingin kita lakukan di masa depan?",
                answers: [
                    "Melupakan semua kenangan",
                    "Tidak bertemu lagi",
                    "Membuat lebih banyak kenangan bersama 💙✨",
                    "Berhenti berteman"
                ],
                correct: 2
            }

        ];


        let currentQuestion = 0;
        let score = 0;
        let answered = false;


        const questionElement =
            document.getElementById("question");

        const answersElement =
            document.getElementById("answers");

        const progressElement =
            document.getElementById("progress");

        const feedbackElement =
            document.getElementById("feedback");

        const nextQuestionButton =
            document.getElementById("nextQuestion");


        function showQuestion() {

            answered = false;

            feedbackElement.innerHTML = "";

            nextQuestionButton.classList.remove("show");

            const question = questions[currentQuestion];

            progressElement.innerHTML =
                "Pertanyaan " +
                (currentQuestion + 1) +
                " dari " +
                questions.length;

            questionElement.innerHTML =
                question.question;

            answersElement.innerHTML = "";


            question.answers.forEach((answer, index) => {

                const button =
                    document.createElement("button");

                button.className = "answer";

                button.innerHTML = answer;

                button.onclick = function() {
                    chooseAnswer(index, button);
                };

                answersElement.appendChild(button);

            });

        }


        function chooseAnswer(index, button) {

            if (answered) return;

            answered = true;

            const correct =
                questions[currentQuestion].correct;

            const allButtons =
                document.querySelectorAll(".answer");


            if (index === correct) {

                score++;

                button.classList.add("correct");

                feedbackElement.innerHTML =
                    "✅ Benar! Hebat banget! 💙";

            } else {

                button.classList.add("wrong");

                allButtons[correct].classList.add("correct");

                feedbackElement.innerHTML =
                    "❌ Kurang tepat! Jawaban yang benar sudah ditandai 💙";

            }


            nextQuestionButton.classList.add("show");

        }


        nextQuestionButton.onclick = function() {

            currentQuestion++;

            if (currentQuestion < questions.length) {

                showQuestion();

            } else {

                showResult();

            }

        };


        function showResult() {

            document.getElementById("quiz").style.display =
                "none";

            document.getElementById("result").style.display =
                "block";


            document.getElementById("score").innerHTML =
                score + " / " + questions.length;


            if (score === 10) {

                document.getElementById("resultText").innerHTML =
                    "Sempurna! 🥳💙<br>Kamu benar-benar mengenal persahabatan kita!";

            } else if (score >= 7) {

                document.getElementById("resultText").innerHTML =
                    "Hebat banget! 🥰💙<br>Kamu cukup mengenal persahabatan kita!";

            } else if (score >= 5) {

                document.getElementById("resultText").innerHTML =
                    "Lumayan! 😆💙<br>Masih banyak kenangan yang harus kita buat bersama!";

            } else {

                document.getElementById("resultText").innerHTML =
                    "Tidak apa-apa! 🤍<br>Yang penting persahabatan kita tetap bersama!";

            }

        }


        /* TOMBOL BERIKUTNYA */

        function keKenangan() {

            window.location.href = "kenangan.html";

        }


        showQuestion();

    </script>

</body>
</html>
