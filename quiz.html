<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friendship Quiz 💙</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dff4ff, #ffffff, #c9eaff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            color: #164d70;
        }

        .quiz-container {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 15px 40px rgba(37, 128, 180, 0.20);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Hiasan hati */
        .heart {
            position: absolute;
            color: #dff4ff;
            font-size: 55px;
            opacity: 0.7;
            z-index: 0;
        }

        .heart1 {
            top: 70px;
            right: 25px;
        }

        .heart2 {
            bottom: 40px;
            left: 20px;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            color: #0879bd;
            font-weight: 800;
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.5;
            color: #557d96;
            margin: 18px 0 25px;
        }

        .progress-area {
            margin-bottom: 25px;
        }

        .progress-text {
            font-size: 18px;
            font-weight: bold;
            color: #1788c7;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e1f3fc;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 10%;
            background: linear-gradient(90deg, #168bd0, #54b9ec);
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        .question {
            font-size: 21px;
            font-weight: bold;
            color: #185477;
            line-height: 1.5;
            margin: 25px 0 20px;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-btn {
            width: 100%;
            padding: 15px;
            border: 2px solid #b9e2f7;
            border-radius: 15px;
            background: #f8fdff;
            color: #205a78;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .answer-btn:hover {
            background: #e3f5ff;
            border-color: #1591d2;
            transform: translateY(-2px);
        }

        .answer-btn:active {
            transform: scale(0.98);
        }

        .answer-btn.correct {
            background: #d8f8e3;
            border-color: #32a85a;
            color: #19733a;
        }

        .answer-btn.wrong {
            background: #ffe1e1;
            border-color: #e45b5b;
            color: #a83232;
        }

        .feedback {
            min-height: 30px;
            margin-top: 18px;
            font-size: 17px;
            font-weight: bold;
        }

        .next-btn {
            display: none;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 15px;
            background: #087fc3;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(8, 127, 195, 0.25);
        }

        .next-btn:hover {
            background: #066da8;
        }

        /* Hasil akhir */
        .result {
            display: none;
        }

        .result h2 {
            font-size: 30px;
            color: #087fc3;
            margin-bottom: 10px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #087fc3;
            margin: 15px 0;
        }

        .result-message {
            font-size: 18px;
            line-height: 1.6;
            color: #557d96;
        }

        .restart-btn {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: #087fc3;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .restart-btn:hover {
            background: #066da8;
        }

        .small-text {
            margin-top: 22px;
            font-size: 14px;
            color: #82a5b9;
        }

        @media (max-width: 380px) {
            h1 {
                font-size: 31px;
            }

            .quiz-container {
                padding: 25px 18px;
            }

            .question {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <div class="heart heart1">♡</div>
    <div class="heart heart2">♡</div>

    <div class="content">

        <!-- BAGIAN QUIZ -->
        <div id="quiz">

            <h1>Friendship Quiz 💙</h1>

            <div class="subtitle">
                Yuk jawab pertanyaan tentang<br>
                persahabatan kita! 🥰
            </div>

            <div class="progress-area">
                <div class="progress-text" id="progressText">
                    Pertanyaan 1 dari 10
                </div>

                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
            </div>

            <div class="question" id="question">
                Pertanyaan akan muncul di sini
            </div>

            <div class="answers" id="answers"></div>

            <div class="feedback" id="feedback"></div>

            <button class="next-btn" id="nextButton" onclick="nextQuestion()">
                Pertanyaan Berikutnya ➜
            </button>

            <div class="small-text">
                Jawab dengan jujur yaa 💙
            </div>

        </div>

        <!-- HASIL AKHIR -->
        <div class="result" id="result">

            <h2>Quiz Selesai! 🎉</h2>

            <div class="score" id="score">
                0 / 10
            </div>

            <div class="result-message" id="resultMessage">
                Terima kasih sudah bermain! 💙
            </div>

            <button class="restart-btn" onclick="restartQuiz()">
                🔄 Main Lagi
            </button>

        </div>

    </div>
</div>


<script>

    // ==========================================
    // DATA PERTANYAAN
    // ==========================================

    const questions = [

        {
            question: "Siapa yang biasanya lebih dulu mengajak ngobrol? 💬",
            answers: [
                "Aku",
                "Kamu",
                "Tergantung keadaan",
                "Sama-sama"
            ],
            correct: 3
        },

        {
            question: "Kalau kita pergi bersama, biasanya paling sering melakukan apa? 🥰",
            answers: [
                "Jalan-jalan",
                "Foto-foto",
                "Makan dan ngobrol",
                "Semua benar"
            ],
            correct: 3
        },

        {
            question: "Kalau salah satu dari kita sedang sedih, biasanya yang dilakukan adalah... 💙",
            answers: [
                "Dibiarkan sendiri",
                "Dihibur",
                "Diajak bertengkar",
                "Pura-pura tidak tahu"
            ],
            correct: 1
        },

        {
            question: "Apa yang paling penting dalam persahabatan kita? 🤍",
            answers: [
                "Kepercayaan",
                "Saling mendukung",
                "Saling memahami",
                "Semua benar"
            ],
            correct: 3
        },

        {
            question: "Kalau sedang berkumpul, biasanya waktu terasa... ⏰",
            answers: [
                "Lama sekali",
                "Biasa saja",
                "Cepat banget",
                "Tidak terasa"
            ],
            correct: 2
        },

        {
            question: "Kalau kita punya masalah, sebaiknya... 🌷",
            answers: [
                "Saling menjauh",
                "Membicarakannya baik-baik",
                "Diam saja",
                "Saling menyalahkan"
            ],
            correct: 1
        },

        {
            question: "Hal kecil apa yang bisa membuat persahabatan terasa menyenangkan? 🥹",
            answers: [
                "Chat random",
                "Bercanda",
                "Saling perhatian",
                "Semua benar"
            ],
            correct: 3
        },

        {
            question: "Kalau ada momen lucu, biasanya kita akan... 😂",
            answers: [
                "Melupakannya",
                "Menertawakannya bersama",
                "Marah",
                "Diam"
            ],
            correct: 1
        },

        {
            question: "Menurutmu, persahabatan yang baik harus memiliki... 💕",
            answers: [
                "Kejujuran",
                "Kepercayaan",
                "Kesetiaan",
                "Semua benar"
            ],
            correct: 3
        },

        {
            question: "Apa harapan untuk persahabatan kita ke depannya? 💙",
            answers: [
                "Tetap berteman",
                "Semakin dekat",
                "Selalu saling mendukung",
                "Semua jawaban benar"
            ],
            correct: 3
        }

    ];


    // ==========================================
    // VARIABEL QUIZ
    // ==========================================

    let currentQuestion = 0;
    let score = 0;
    let answered = false;


    // ==========================================
    // MENAMPILKAN PERTANYAAN
    // ==========================================

    function showQuestion() {

        answered = false;

        const questionData = questions[currentQuestion];

        document.getElementById("question").textContent =
            questionData.question;

        document.getElementById("progressText").textContent =
            "Pertanyaan " + (currentQuestion + 1) + " dari " + questions.length;

        const progressPercent =
            ((currentQuestion + 1) / questions.length) * 100;

        document.getElementById("progress").style.width =
            progressPercent + "%";


        const answersContainer =
            document.getElementById("answers");

        answersContainer.innerHTML = "";


        questionData.answers.forEach((answer, index) => {

            const button = document.createElement("button");

            button.className = "answer-btn";

            button.textContent =
                String.fromCharCode(65 + index) + ". " + answer;

            button.onclick = function() {
                checkAnswer(index, button);
            };

            answersContainer.appendChild(button);

        });


        document.getElementById("feedback").textContent = "";

        document.getElementById("nextButton").style.display = "none";
    }


    // ==========================================
    // CEK JAWABAN
    // ==========================================

    function checkAnswer(selectedIndex, selectedButton) {

        if (answered) {
            return;
        }

        answered = true;

        const correctIndex =
            questions[currentQuestion].correct;

        const buttons =
            document.querySelectorAll(".answer-btn");


        // Matikan semua tombol
        buttons.forEach(button => {
            button.style.pointerEvents = "none";
        });


        if (selectedIndex === correctIndex) {

            score++;

            selectedButton.classList.add("correct");

            document.getElementById("feedback").innerHTML =
                "🎉 BENAR! Jawaban kamu tepat 💙";

            document.getElementById("feedback").style.color =
                "#219653";

        } else {

            selectedButton.classList.add("wrong");

            buttons[correctIndex].classList.add("correct");

            document.getElementById("feedback").innerHTML =
                "😊 Belum tepat! Jawaban yang benar adalah: " +
                questions[currentQuestion].answers[correctIndex];

            document.getElementById("feedback").style.color =
                "#d14c4c";
        }


        // Ganti tulisan tombol
        if (currentQuestion === questions.length - 1) {

            document.getElementById("nextButton").textContent =
                "Lihat Hasil 🎉";

        } else {

            document.getElementById("nextButton").textContent =
                "Pertanyaan Berikutnya ➜";
        }


        document.getElementById("nextButton").style.display =
            "block";
    }


    // ==========================================
    // PERTANYAAN BERIKUTNYA
    // ==========================================

    function nextQuestion() {

        currentQuestion++;

        if (currentQuestion < questions.length) {

            showQuestion();

        } else {

            showResult();

        }
    }


    // ==========================================
    // HASIL QUIZ
    // ==========================================

    function showResult() {

        document.getElementById("quiz").style.display =
            "none";

        document.getElementById("result").style.display =
            "block";


        document.getElementById("score").textContent =
            score + " / " + questions.length;


        let message = "";


        if (score === 10) {

            message =
                "Wahhh sempurna! 🥹💙<br>" +
                "Kamu benar-benar jago mengingat cerita persahabatan kita!";

        } else if (score >= 7) {

            message =
                "Hebat banget! 🥰💙<br>" +
                "Berarti kamu cukup mengenal persahabatan kita!";

        } else if (score >= 5) {

            message =
                "Lumayan nih! 😆💙<br>" +
                "Masih ada beberapa cerita yang harus kita ingat bersama.";

        } else {

            message =
                "Hehe tidak apa-apa 😆💙<br>" +
                "Yang penting persahabatan kita tetap selalu bersama!";
        }


        document.getElementById("resultMessage").innerHTML =
            message;
    }


    // ==========================================
    // ULANGI QUIZ
    // ==========================================

    function restartQuiz() {

        currentQuestion = 0;

        score = 0;

        document.getElementById("quiz").style.display =
            "block";

        document.getElementById("result").style.display =
            "none";

        showQuestion();

    }


    // ==========================================
    // JALANKAN QUIZ SAAT HALAMAN DIBUKA
    // ==========================================

    showQuestion();

</script>

</body>
                </html>
