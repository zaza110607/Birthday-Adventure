<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Piya's Friendship Quiz 💙</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .quiz-container {
            width: 90%;
            max-width: 430px;
            background: white;
            padding: 30px 22px;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(41,129,180,0.18);
            text-align: center;
            border: 2px solid #d5effc;
            animation: appear 0.7s ease;
        }

        .quiz-icon {
            font-size: 55px;
            margin-bottom: 8px;
        }

        .progress {
            font-size: 13px;
            color: #579bc5;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .quiz-container h1 {
            font-size: 27px;
            color: #164a70;
            margin-bottom: 12px;
        }

        .question {
            font-size: 18px;
            line-height: 1.5;
            color: #315d76;
            font-weight: bold;
            margin: 20px 0;
        }

        .answer {
            width: 100%;
            padding: 14px;
            margin: 7px 0;

            border: 2px solid #c7eafb;
            border-radius: 14px;

            background: #f4fbff;
            color: #245a78;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.25s;
        }

        .answer:hover {
            background: #e2f5ff;
            transform: translateY(-2px);
        }

        .answer.correct {
            background: #d9f8e8;
            border-color: #58b985;
            color: #187447;
        }

        .answer.wrong {
            background: #ffe1e7;
            border-color: #e07a91;
            color: #a93650;
        }

        #feedback {
            min-height: 25px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .next-btn {
            display: none;

            width: 100%;
            padding: 14px;

            margin-top: 15px;

            border: none;
            border-radius: 14px;

            background: #278cc4;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .result {
            display: none;
        }

        .score {
            font-size: 40px;
            font-weight: bold;
            color: #278cc4;
            margin: 20px 0;
        }

        .continue-btn {
            display: inline-block;

            padding: 14px 25px;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #278cc4,
                #54b9e8
            );

            color: white;
            text-decoration: none;

            font-weight: bold;
        }
    </style>
</head>
